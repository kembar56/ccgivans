<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CC GIVANS</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0f172a;
            color: #f1f5f9;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .display {
            width: 100%;
            max-width: 1400px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 20px 30px;
            background: radial-gradient(circle at 20% 30%, #1e293b, #0f172a);
            border-radius: 40px;
            box-shadow: 0 0 60px rgba(0,0,0,0.7);
            border: 1px solid #334155;
            position: relative;
        }

        .paket-badge {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 1.2rem;
            background: #1e293b;
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid #facc15;
            color: #facc15;
            font-weight: 600;
            letter-spacing: 0.5px;
            z-index: 10;
        }

        .timer-area {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 60px;
            flex: 0 0 auto;
            margin-bottom: 5px;
        }
        .timer-display {
            font-size: 3.5rem;
            font-weight: 700;
            color: #facc15;
            text-shadow: 0 0 30px rgba(250,204,21,0.2);
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
            transition: color 0.3s;
        }
        .timer-display.warning {
            color: #ef4444;
            animation: blink 0.6s infinite alternate;
        }
        @keyframes blink {
            0% { opacity: 1; }
            100% { opacity: 0.2; }
        }

        .soal-wrapper {
            width: 100%;
            max-width: 92%;
            flex: 0 0 auto;
            max-height: 40vh;
            min-height: 80px;
            overflow-y: auto; /* agar scroll jika gambar besar */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 5px 0;
            padding: 0 10px;
        }
        .pertanyaan-besar {
            font-size: 4rem;
            font-weight: 700;
            text-align: center;
            word-break: break-word;
            line-height: 1.3;
            width: 100%;
            max-height: 100%;
            overflow: hidden;
            padding: 0 10px;
        }
        .pertanyaan-besar img {
            max-width: 100%;
            max-height: 400px;
            display: block;
            margin: 10px auto;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .kunci-area {
            font-size: 1.2rem;
            color: #94a3b8;
            background: rgba(0,0,0,0.3);
            padding: 6px 20px;
            border-radius: 20px;
            border: 1px dashed #475569;
            text-align: center;
            margin-top: 5px;
            max-width: 80%;
            flex: 0 0 auto;
        }
        .kunci-area span {
            color: #facc15;
            font-weight: 600;
        }

        .status-soal {
            position: fixed;
            bottom: 20px;
            left: 30px;
            font-size: 1.2rem;
            color: #94a3b8;
            background: rgba(0,0,0,0.6);
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid #334155;
            pointer-events: none;
            z-index: 20;
            transition: color 0.3s;
        }

        .status-info {
            position: fixed;
            bottom: 20px;
            right: 30px;
            background: rgba(0,0,0,0.7);
            padding: 6px 18px;
            border-radius: 30px;
            color: #94a3b8;
            font-size: 0.9rem;
            border: 1px solid #334155;
            pointer-events: none;
            z-index: 20;
        }

        .footer-skor {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1 1 auto;
            width: 100%;
            padding: 10px 0;
            min-height: 100px;
            flex-direction: column;
            gap: 10px;
        }
        .footer-skor.aktif {
            flex: 1 1 auto;
        }

        .skor-table {
            width: 100%;
            max-width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .skor-table th,
        .skor-table td {
            text-align: center;
            padding: 8px 12px;
            border: 2px solid rgba(255, 255, 255, 0.08);
        }
        .skor-table th {
            color: #94a3b8;
            font-weight: 600;
            font-size: 1.2rem;
            letter-spacing: 1px;
            border-bottom: 3px solid #facc15;
            text-transform: uppercase;
        }
        .skor-table td {
            font-weight: 700;
            color: #facc15;
            text-shadow: 0 0 20px rgba(250,204,21,0.15);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .skor-table .nama-tim {
            color: #cbd5e1;
            font-weight: 600;
        }
        .skor-table .skor-angka {
            font-weight: 800;
            color: #facc15;
        }
        .skor-table .nama-tim,
        .skor-table .skor-angka {
            font-size: clamp(1.4rem, 4vw, 4.5rem);
        }
        .skor-table th {
            font-size: clamp(0.9rem, 2vw, 1.4rem);
        }
        .footer-skor.aktif .skor-table .nama-tim,
        .footer-skor.aktif .skor-table .skor-angka {
            font-size: clamp(2rem, 6vw, 6rem);
        }

        .histori-area {
            width: 100%;
            max-width: 80%;
            margin-top: 5px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .histori-area.hidden {
            display: none !important;
        }
        .histori-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .histori-table th {
            color: #94a3b8;
            font-weight: 500;
            padding: 4px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: left;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .histori-table td {
            padding: 3px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: #cbd5e1;
            font-size: 0.85rem;
        }
        .histori-table .h-perubahan.plus { color: #22c55e; }
        .histori-table .h-perubahan.minus { color: #ef4444; }
        .histori-table .h-perubahan.buzzer { color: #facc15; }
        .histori-table .h-perubahan.reset { color: #f97316; }
        .histori-table .h-skor { font-weight: 700; color: #facc15; }
        .histori-table .h-waktu { color: #94a3b8; font-size: 0.7rem; }

        .hidden {
            display: none !important;
        }

        @media (max-width: 900px) {
            .timer-display { font-size: 2.8rem; }
            .pertanyaan-besar { font-size: 3rem; }
            .kunci-area { font-size: 1rem; }
            .status-soal { font-size: 1rem; left: 15px; bottom: 15px; padding: 4px 14px; }
            .status-info { font-size: 0.8rem; right: 15px; bottom: 15px; padding: 4px 14px; }
            .soal-wrapper { max-height: 32vh; }
            .skor-table .nama-tim,
            .skor-table .skor-angka {
                font-size: clamp(1.2rem, 3.5vw, 3.5rem);
            }
            .footer-skor.aktif .skor-table .nama-tim,
            .footer-skor.aktif .skor-table .skor-angka {
                font-size: clamp(1.6rem, 5vw, 4.5rem);
            }
            .histori-table { font-size: 0.75rem; }
        }
        @media (max-width: 600px) {
            .timer-display { font-size: 2.2rem; }
            .pertanyaan-besar { font-size: 2.5rem; }
            .paket-badge { font-size: 0.8rem; top: 10px; right: 15px; padding: 4px 12px; }
            .status-soal { font-size: 0.85rem; left: 10px; bottom: 10px; padding: 3px 12px; }
            .status-info { font-size: 0.7rem; right: 10px; bottom: 10px; padding: 3px 12px; }
            .soal-wrapper { max-height: 28vh; }
            .skor-table td, .skor-table th { padding: 4px 6px; }
            .skor-table .nama-tim,
            .skor-table .skor-angka {
                font-size: clamp(1rem, 3vw, 2.5rem);
            }
            .footer-skor.aktif .skor-table .nama-tim,
            .footer-skor.aktif .skor-table .skor-angka {
                font-size: clamp(1.2rem, 4vw, 3rem);
            }
            .skor-table th {
                font-size: clamp(0.7rem, 1.5vw, 1rem);
            }
            .histori-table { font-size: 0.65rem; }
            .histori-table th, .histori-table td { padding: 2px 6px; }
            .histori-area { max-width: 95%; }
        }
    </style>
</head>
<body>
    <div class="display" id="displayArea">
        <div class="paket-badge" id="paketBadge">Paket A</div>

        <div class="timer-area" id="timerArea">
            <div class="timer-display" id="timerDisplay">00:30</div>
        </div>

        <div class="soal-wrapper" id="soalWrapper">
            <div class="pertanyaan-besar" id="pertanyaanDisplay">Menunggu soal...</div>
        </div>

        <div class="kunci-area" id="kunciArea">
            📌 Kunci: <span id="kunciText">-</span>
        </div>

        <div class="status-soal" id="statusSoal">⏳ Menunggu timer</div>

        <div class="footer-skor" id="skorDisplay">
            <table class="skor-table" id="skorTable">
                <thead>
                    <tr>
                        <th>Tim</th>
                        <th>Skor</th>
                    </tr>
                </thead>
                <tbody id="skorBody"></tbody>
            </table>
            <div class="histori-area hidden" id="historiArea">
                <table class="histori-table">
                    <thead>
                        <tr>
                            <th>Waktu</th>
                            <th>Tim</th>
                            <th>Perubahan</th>
                            <th>Skor</th>
                        </tr>
                    </thead>
                    <tbody id="historiBody"></tbody>
                </table>
            </div>
        </div>

        <div class="status-info" id="statusInfo">Menunggu koneksi...</div>
    </div>

    <script>
        const channel = new BroadcastChannel('cerdas-cermat');
        const timerDisplay = document.getElementById('timerDisplay');
        const pertanyaanDisplay = document.getElementById('pertanyaanDisplay');
        const kunciText = document.getElementById('kunciText');
        const statusSoal = document.getElementById('statusSoal');
        const skorDisplay = document.getElementById('skorDisplay');
        const skorBody = document.getElementById('skorBody');
        const historiBody = document.getElementById('historiBody');
        const historiArea = document.getElementById('historiArea');
        const statusInfo = document.getElementById('statusInfo');
        const paketBadge = document.getElementById('paketBadge');
        const timerArea = document.getElementById('timerArea');
        const kunciArea = document.getElementById('kunciArea');

        let timerInterval = null;
        let localTimerValue = 30;
        let timerRunning = false;
        let timerHabis = false;
        let lastData = null;

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function fitTextToContainer(element) {
            const container = element.parentElement;
            if (!container) return;
            element.style.fontSize = '4rem';
            let fontSize = 4.0;
            const maxHeight = container.clientHeight;
            if (maxHeight === 0) return;
            while (element.scrollHeight > maxHeight && fontSize > 0.8) {
                fontSize -= 0.1;
                element.style.fontSize = fontSize + 'rem';
                if (fontSize <= 0.8) break;
            }
            if (element.scrollHeight > maxHeight) {
                element.style.fontSize = '0.8rem';
                element.style.overflow = 'hidden';
            } else {
                element.style.overflow = 'hidden';
            }
        }

        function resetTimerState() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            timerRunning = false;
            timerDisplay.classList.remove('warning');
        }

        function render(data) {
            lastData = data;

            const t = data.tampilkan || { soal: true, kunci: true, timer: true, skor: true, paket: true, histori: false };

            // Paket
            if (t.paket && data.paketAktif) {
                paketBadge.classList.remove('hidden');
                paketBadge.textContent = `Paket ${data.paketAktif}`;
            } else {
                paketBadge.classList.add('hidden');
            }

            // Timer
            if (t.timer) {
                timerArea.classList.remove('hidden');
                if (data.timerRunning && data.pertanyaan && data.pertanyaan.trim() !== '') {
                    if (timerHabis) {
                        timerHabis = false;
                    }
                    localTimerValue = data.timerValue;
                    timerDisplay.textContent = formatTime(localTimerValue);
                    timerDisplay.classList.add('warning');
                    if (!timerInterval) {
                        timerInterval = setInterval(() => {
                            if (timerRunning) {
                                localTimerValue--;
                                timerDisplay.textContent = formatTime(localTimerValue);
                                if (localTimerValue <= 0) {
                                    clearInterval(timerInterval);
                                    timerInterval = null;
                                    timerRunning = false;
                                    timerDisplay.classList.remove('warning');
                                    timerHabis = true;
                                    if (lastData) {
                                        const newData = { ...lastData, timerRunning: false };
                                        render(newData);
                                    }
                                }
                            }
                        }, 1000);
                    }
                    timerRunning = true;
                } else {
                    timerDisplay.textContent = formatTime(localTimerValue);
                    timerDisplay.classList.remove('warning');
                    timerRunning = false;
                    if (timerInterval) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                    }
                }
            } else {
                timerArea.classList.add('hidden');
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                timerRunning = false;
                timerDisplay.classList.remove('warning');
            }

            // SOAL - menggunakan innerHTML agar gambar tampil
            if (t.soal) {
                if (data.pertanyaan && data.pertanyaan.trim() !== '') {
                    pertanyaanDisplay.innerHTML = data.pertanyaan;
                } else {
                    pertanyaanDisplay.innerHTML = '📭 Belum ada soal ditampilkan';
                }
                pertanyaanDisplay.classList.remove('hidden');
                // fitTextToContainer hanya untuk teks, tidak untuk gambar. Kita akan lewati jika ada gambar.
                // Cek apakah ada img tag
                if (!pertanyaanDisplay.querySelector('img')) {
                    requestAnimationFrame(() => {
                        fitTextToContainer(pertanyaanDisplay);
                    });
                } else {
                    // Jika ada gambar, atur font size tetap 4rem dan biarkan gambar mengikuti
                    pertanyaanDisplay.style.fontSize = '4rem';
                    pertanyaanDisplay.style.overflow = 'auto';
                }
            } else {
                pertanyaanDisplay.classList.add('hidden');
            }

            // Kunci
            if (t.kunci) {
                kunciArea.classList.remove('hidden');
                kunciText.textContent = data.kunciJawaban || '-';
            } else {
                kunciArea.classList.add('hidden');
            }

            // SKOR
            if (t.skor) {
                skorDisplay.classList.remove('hidden');
                skorDisplay.classList.add('aktif');
                skorBody.innerHTML = '';
                if (data.tim && data.tim.length) {
                    data.tim.forEach(tim => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td class="nama-tim">${tim.nama}</td>
                            <td class="skor-angka">${tim.skor}</td>
                        `;
                        skorBody.appendChild(row);
                    });
                }
            } else {
                skorDisplay.classList.add('hidden');
                skorDisplay.classList.remove('aktif');
                skorBody.innerHTML = '';
            }

            // HISTORI
            if (t.histori && data.historiData && data.historiData.length > 0) {
                historiArea.classList.remove('hidden');
                historiBody.innerHTML = '';
                const reversed = [...data.historiData].reverse();
                reversed.forEach(item => {
                    const row = document.createElement('tr');
                    let kelas = '';
                    if (item.perubahan.startsWith('+')) kelas = 'plus';
                    else if (item.perubahan.startsWith('-')) kelas = 'minus';
                    else if (item.perubahan === 'Buzzer') kelas = 'buzzer';
                    else if (item.perubahan === 'Reset') kelas = 'reset';
                    row.innerHTML = `
                        <td class="h-waktu">${item.waktu}</td>
                        <td>${item.timNama}</td>
                        <td class="h-perubahan ${kelas}">${item.perubahan}</td>
                        <td class="h-skor">${item.skorBaru}</td>
                    `;
                    historiBody.appendChild(row);
                });
            } else if (t.histori && data.historiData && data.historiData.length === 0) {
                historiArea.classList.remove('hidden');
                historiBody.innerHTML = `<tr><td colspan="4" style="text-align:center;color:#94a3b8;padding:10px;">Belum ada histori skor.</td></tr>`;
            } else {
                historiArea.classList.add('hidden');
                historiBody.innerHTML = '';
            }

            // STATUS SOAL
            if (timerHabis) {
                statusSoal.textContent = '⏰ Waktu habis!';
                statusSoal.style.color = '#ef4444';
            } else if (data.soalTerjawab) {
                statusSoal.textContent = '🔔 Sudah dijawab / Buzzer ditekan';
                statusSoal.style.color = '#facc15';
            } else if (data.timerRunning && data.pertanyaan && data.pertanyaan.trim() !== '') {
                statusSoal.textContent = '⏳ Timer berjalan...';
                statusSoal.style.color = '#22c55e';
            } else {
                statusSoal.textContent = '⏸️ Menunggu timer';
                statusSoal.style.color = '#94a3b8';
            }

            const total = data.totalSoal || 0;
            statusInfo.textContent = `Soal ${(data.soalIndex || 0)+1} dari ${total} | Paket ${data.paketAktif || '-'}`;
        }

        channel.onmessage = (e) => {
            const data = e.data;
            if (data.type === 'update') {
                if (data.timerRunning) {
                    timerHabis = false;
                }
                render(data);
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
            channel.postMessage({ type: 'request' });
        });

        window.addEventListener('resize', () => {
            const el = pertanyaanDisplay;
            if (!el.classList.contains('hidden') && !el.querySelector('img')) {
                requestAnimationFrame(() => {
                    fitTextToContainer(el);
                });
            }
        });
    </script>
</body>
</html>
